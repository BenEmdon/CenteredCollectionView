name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  spm:
    name: Swift Package Manager build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS]
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode (tvOS SDK lives there)
        if: matrix.platform == 'tvOS'
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true
      - name: Resolve build destination
        run: |
          if [ "${{ matrix.platform }}" = "iOS" ]; then
            echo "DEST=generic/platform=iOS" >> "$GITHUB_ENV"
          else
            SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "tvOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("Apple TV"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
            echo "DEST=platform=tvOS Simulator,id=$SIM_ID" >> "$GITHUB_ENV"
          fi
          echo "Destination: $DEST"
      - name: Build package for ${{ matrix.platform }}
        run: >-
          xcodebuild build
          -scheme CenteredCollectionView
          -destination '${{ env.DEST }}'
          CODE_SIGNING_ALLOWED=NO

  example:
    name: Example app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build example workspace
        run: >-
          xcodebuild build
          -workspace Example/CenteredCollectionView.xcworkspace
          -scheme CenteredCollectionView-Example
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO

  pod-lint:
    name: CocoaPods spec lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Lint podspec
        run: pod lib lint CenteredCollectionView.podspec --allow-warnings

  test:
    name: Unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Pick an available iPhone simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
      - name: Run tests on iOS Simulator
        run: >-
          xcodebuild test
          -workspace Example/CenteredCollectionView.xcworkspace
          -scheme CenteredCollectionView-Example
          -destination 'platform=iOS Simulator,id=${{ env.SIM_ID }}'
